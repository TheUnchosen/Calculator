<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Calculator App</title>
    
    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- import javascript -->
    <script src="script.js" defer></script>
    <style>
    
    

</style>
 
  </head>  
  <body>
    
    <div class="wrapper">
        <section class="calculator-screen">
          <div class = "resultContainer" placeholder="0"><p></p></div>

        </section>
    
        <section class="calculator-buttons">
<div class="container">
  <div class="C">
    <button class = "calcButtonClear">
        C
    </button>
  </div>
  <div class="back">
    <button class = "calcButtonBack">
        ←
    </button>
  </div>

  
  <div class="no7">
    <button class = "calcButton1">
        7
    </button>
  </div>
  <div class="no8">
    <button class = "calcButton1">
        8
    </button>
  </div>
  <div class="no9">
    <button class = "calcButton1">
        9
    </button>
  </div>
  
  <div class="no4">
    <button class = "calcButton1">
        4
    </button>
  </div>
  <div class="no5">
    <button class = "calcButton1">
        5
    </button>
  </div>
  <div class="no6">
    <button class = "calcButton1">
        6
    </button>
  </div>
  <div class="no1">
    <button class = "calcButton1">
        1
    </button>
  </div>
  <div class="no2">
    <button class = "calcButton1">
        2
    </button>
  </div>
  <div class="no3">
    <button class = "calcButton1">
        3
    </button>
  </div>
  <div class="no0">
    <button class = "calcButton1">
        0
    </button>
  </div>


  <div class="div">
    <button class = "calcButton2">
        ÷
    </button>
  </div>
  <div class="sub">
    <button class = "calcButton2">
        -
    </button>
  </div>
  <div class="plus">
    <button class = "calcButton2">
        +
    </button>
  </div>
  <div class="multi">
    <button class = "calcButton2">
        x
    </button>
  </div>
  <div class="equal">
    <button class = "calcButton2">
        =
    </button>
  </div>

</div>


  

    
        </section>
    </div>
    
  </body>
</html>
